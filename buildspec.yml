version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo "Installing dependencies..."
      - npm install

  pre_build:
    commands:
      - echo "Running pre-build phase..."
      - npm test
      - echo "Pre-build phase completed"

  build:
    commands:
      - echo "Building application..."
      - echo "Build completed successfully"

  post_build:
    commands:
      - echo "Running post-build phase..."
      - echo "Preparing for deployment"

artifacts:
  files:
    - server.js
    - package.json
    - package-lock.json
    - appspec.yml
  discard-paths: yes

cache:
  paths:
    - 'node_modules/**/*'
