version: 0.0
os: linux

files:
  - source: /
    destination: /var/www/aws-codebuild-sample

permissions:
  - object: /var/www/aws-codebuild-sample
    owner: ec2-user
    group: ec2-user
    type:
      - directory
    mode: 755
  - object: /var/www/aws-codebuild-sample
    owner: ec2-user
    group: ec2-user
    type:
      - file
    mode: 644

hooks:
  BeforeInstall:
    - location: scripts/install_dependencies.sh
      timeout: 300
      runas: root
  AfterInstall:
    - location: scripts/start_server.sh
      timeout: 300
      runas: root
  ApplicationStart:
    - location: scripts/start_server.sh
      timeout: 300
      runas: root
  ValidateService:
    - location: scripts/validate_service.sh
      timeout: 300
      runas: root
